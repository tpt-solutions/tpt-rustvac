[workspace]
members = [
    "crates/tpt-rustvac-core",
    "crates/tpt-rustvac-cli",
    "crates/tpt-rustvac-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-rustvac"
readme = "README.md"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
