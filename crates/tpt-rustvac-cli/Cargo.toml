[package]
name = "tpt-rustvac-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "rustvac: find Cargo target folders, measure any folder, and archive what you do not need."
keywords = ["cargo", "target", "disk-usage", "cleanup", "cli"]
categories = ["command-line-utilities", "development-tools", "filesystem"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tabled = "0.22.0"
tpt-rustvac-core = { version = "0.1.0", path = "../tpt-rustvac-core" }

[[bin]]
name = "rustvac"
path = "src/main.rs"
