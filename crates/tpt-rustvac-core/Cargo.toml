[package]
name = "tpt-rustvac-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Scan, measure, archive and restore Rust target folders. The engine behind rustvac."
keywords = ["cargo", "target", "disk-usage", "cleanup", "archive"]
categories = ["filesystem", "development-tools"]

[dependencies]
chrono = "0.4.45"
glob = "0.3.4"
ignore = "0.4.30"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
thiserror = "2.0.21"
toml = "1.1.8"
trash = "5.2.9"
zstd = { version = "0.14.3", features = ["zstdmt"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
