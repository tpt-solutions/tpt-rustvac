# cargo-deny policy. Run with: cargo deny check
#
# Licence rule for this project: dependencies must be MIT, or dual-licensed
# with MIT (e.g. "MIT OR Apache-2.0"). Apache-2.0 on its own is NOT allowed.
# "Apache-2.0" is deliberately absent from the allow list below. An OR
# expression still passes through its MIT option.

[graph]
all-features = false
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
ignore = []
# Unmaintained-crate notices are reported for direct dependencies only. Vulnerability
# advisories are still checked for the whole tree.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "BSD-3-Clause",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# tpt-shell is pinned by commit in crates/tpt-rustvac-gui/Cargo.toml.
allow-git = ["https://github.com/tpt-solutions/tpt-shell"]
